<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AILicious</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="theme-color" content="#0f172a" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0f172a;
    --panel: #161f36;
    --panel-2: #1c2743;
    --border: #2a3555;
    --text: #e6ebf5;
    --text-dim: #93a0c2;
    --accent: #38bdf8;
    --user-bubble: #1e3a8a;
    --assistant-bubble: #1c2743;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    flex-shrink: 0;
  }
  select#agent {
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 14px;
    flex: 1;
    min-width: 0;
  }
  button.icon-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    font-size: 20px;
    line-height: 1;
    padding: 6px 8px;
    cursor: pointer;
    border-radius: 8px;
  }
  button.icon-btn:hover { background: var(--panel-2); color: var(--text); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.4;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--assistant-bubble);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: transparent;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .msg .agent-label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px;
  }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  textarea#input {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
  }
  textarea#input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button#send {
    background: var(--accent);
    color: #04263a;
    border: none;
    border-radius: 12px;
    padding: 0 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button#send:disabled { opacity: 0.5; cursor: default; }

  dialog#settings {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    max-width: 360px;
    width: calc(100% - 32px);
  }
  dialog#settings::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog#settings h2 { margin-top: 0; font-size: 16px; }
  dialog#settings label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  dialog#settings input[type="password"] {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    margin-bottom: 16px;
  }
  dialog#settings .row { display: flex; gap: 8px; justify-content: flex-end; }
  dialog#settings button {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  dialog#settings button.save { background: var(--accent); color: #04263a; font-weight: 600; }
  dialog#settings button.danger { background: transparent; color: var(--error); }
  dialog#settings button.cancel { background: var(--panel-2); color: var(--text); }
</style>
</head>
<body>
  <header>
    <h1>AILicious</h1>
    <select id="agent"></select>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">&#9881;</button>
  </header>

  <main id="messages">
    <div class="empty-state" id="empty-state">Pick an agent above and say hello.</div>
  </main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message..." autocomplete="off"></textarea>
    <button id="send" type="submit">Send</button>
  </form>

  <dialog id="settings">
    <h2>Settings</h2>
    <label for="api-key">API key</label>
    <input
      type="password"
      id="api-key"
      placeholder="X-API-Key for this backend"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
    />
    <div id="key-status" style="font-size: 13px; margin: -10px 0 16px; min-height: 16px;"></div>
    <div class="row">
      <button type="button" class="danger" id="clear-history">Clear this agent's chat</button>
    </div>
    <div class="row" style="margin-top: 12px;">
      <button type="button" class="cancel" id="settings-cancel">Cancel</button>
      <button type="button" class="save" id="settings-save">Save &amp; test</button>
    </div>
  </dialog>

  <script>
    const AGENTS = ["nexus", "forge", "oracle", "sentinel", "codex", "avery"];
    const API_BASE = window.location.origin;

    const messagesEl = document.getElementById("messages");
    const emptyStateEl = document.getElementById("empty-state");
    const agentSelect = document.getElementById("agent");
    const composerForm = document.getElementById("composer");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsDialog = document.getElementById("settings");
    const apiKeyInput = document.getElementById("api-key");
    const settingsSave = document.getElementById("settings-save");
    const settingsCancel = document.getElementById("settings-cancel");
    const clearHistoryBtn = document.getElementById("clear-history");

    function storageKey(agent, suffix) {
      return `ailicious_${suffix}_${agent}`;
    }

    function getApiKey() {
      return (localStorage.getItem("ailicious_api_key") || "").trim();
    }

    function setApiKey(key) {
      localStorage.setItem("ailicious_api_key", key.trim());
    }

    function getSessionId(agent) {
      return localStorage.getItem(storageKey(agent, "session")) || null;
    }

    function setSessionId(agent, sessionId) {
      localStorage.setItem(storageKey(agent, "session"), sessionId);
    }

    function getHistory(agent) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(agent, "history")) || "[]");
      } catch {
        return [];
      }
    }

    function setHistory(agent, history) {
      localStorage.setItem(storageKey(agent, "history"), JSON.stringify(history));
    }

    function currentAgent() {
      return agentSelect.value;
    }

    function renderMessage(role, content) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = content;
      messagesEl.appendChild(div);
      return div;
    }

    function renderHistory(agent) {
      messagesEl.innerHTML = "";
      const history = getHistory(agent);
      if (history.length === 0) {
        messagesEl.appendChild(emptyStateEl);
        return;
      }
      for (const turn of history) {
        renderMessage(turn.role, turn.content);
      }
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function populateAgentSelect() {
      for (const agent of AGENTS) {
        const opt = document.createElement("option");
        opt.value = agent;
        opt.textContent = agent.toUpperCase();
        agentSelect.appendChild(opt);
      }
      agentSelect.value = localStorage.getItem("ailicious_last_agent") || "nexus";
    }

    agentSelect.addEventListener("change", () => {
      localStorage.setItem("ailicious_last_agent", currentAgent());
      renderHistory(currentAgent());
    });

    const keyStatusEl = document.getElementById("key-status");

    function setKeyStatus(text, color) {
      keyStatusEl.textContent = text;
      keyStatusEl.style.color = color;
    }

    settingsBtn.addEventListener("click", () => {
      apiKeyInput.value = getApiKey();
      setKeyStatus("", "");
      settingsDialog.showModal();
    });

    settingsCancel.addEventListener("click", () => settingsDialog.close());

    settingsSave.addEventListener("click", async () => {
      const key = apiKeyInput.value.trim();
      setApiKey(key);

      settingsSave.disabled = true;
      setKeyStatus("Testing key…", "var(--text-dim)");

      try {
        const resp = await fetch(`${API_BASE}/agents`, { headers: { "X-API-Key": key } });
        if (resp.ok) {
          setKeyStatus("✓ Key works — saved.", "#4ade80");
          setTimeout(() => settingsDialog.close(), 700);
        } else if (resp.status === 401) {
          setKeyStatus("✗ Server rejected this key (401). Check for typos or extra spaces.", "var(--error)");
        } else {
          setKeyStatus(`✗ Unexpected response (${resp.status}). Saved anyway.`, "var(--error)");
        }
      } catch (err) {
        setKeyStatus(`✗ Couldn't reach the server: ${err.message}`, "var(--error)");
      } finally {
        settingsSave.disabled = false;
      }
    });

    clearHistoryBtn.addEventListener("click", () => {
      const agent = currentAgent();
      setHistory(agent, []);
      localStorage.removeItem(storageKey(agent, "session"));
      renderHistory(agent);
      settingsDialog.close();
    });

    // auto-grow textarea up to CSS max-height
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = `${inputEl.scrollHeight}px`;
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        composerForm.requestSubmit();
      }
    });

    composerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        settingsBtn.click();
        return;
      }

      const agent = currentAgent();
      const history = getHistory(agent);

      history.push({ role: "user", content: message });
      setHistory(agent, history);
      if (emptyStateEl.parentElement) messagesEl.removeChild(emptyStateEl);
      renderMessage("user", message);
      inputEl.value = "";
      inputEl.style.height = "auto";
      scrollToBottom();

      sendBtn.disabled = true;
      const pending = renderMessage("assistant", "...");
      scrollToBottom();

      try {
        const resp = await fetch(`${API_BASE}/agents/${agent}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": apiKey,
          },
          body: JSON.stringify({ message, session_id: getSessionId(agent) }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          pending.remove();
          renderMessage("error", data.detail || `Request failed (${resp.status})`);
          scrollToBottom();
          return;
        }

        setSessionId(agent, data.session_id);
        pending.textContent = data.response;

        const updatedHistory = getHistory(agent);
        updatedHistory.push({ role: "assistant", content: data.response });
        setHistory(agent, updatedHistory);
      } catch (err) {
        pending.remove();
        renderMessage("error", `Network error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    });

    populateAgentSelect();
    renderHistory(currentAgent());

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
