<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AILicious</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icon-192.png" />
<link rel="apple-touch-icon" href="/icon-192.png" />
<meta name="theme-color" content="#0b1220" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --bg-2: #0f1830;
    --panel: rgba(22, 31, 54, 0.85);
    --panel-2: #1c2743;
    --border: #29365a;
    --text: #eef1f8;
    --text-dim: #8d9ac2;
    --accent: #38bdf8;
    --agent-accent: #38bdf8;
    --user-bubble-a: #3b82f6;
    --user-bubble-b: #6366f1;
    --assistant-bubble: #1a2543;
    --error: #fb7185;
    --success: #4ade80;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(56, 189, 248, 0.12), transparent 60%),
      radial-gradient(900px 500px at 110% 10%, rgba(167, 139, 250, 0.10), transparent 55%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-attachment: fixed;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    padding-top: max(14px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 {
    font-size: 17px;
    font-weight: 700;
    margin: 0;
    flex-shrink: 0;
    letter-spacing: -0.01em;
    background: linear-gradient(135deg, #93c5fd, #c4b5fd);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .agent-picker {
    position: relative;
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
  }
  .agent-dot {
    position: absolute;
    left: 10px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--agent-accent);
    box-shadow: 0 0 8px var(--agent-accent);
    pointer-events: none;
    transition: background 0.2s ease;
  }
  select#agent {
    appearance: none;
    -webkit-appearance: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 30px 8px 26px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    width: 100%;
    transition: border-color 0.2s ease;
  }
  select#agent:focus { outline: none; border-color: var(--agent-accent); }
  .agent-picker::after {
    content: "";
    position: absolute;
    right: 12px;
    width: 7px;
    height: 7px;
    border-right: 2px solid var(--text-dim);
    border-bottom: 2px solid var(--text-dim);
    transform: rotate(45deg);
    pointer-events: none;
  }
  button.icon-btn {
    background: transparent;
    color: var(--text-dim);
    border: none;
    padding: 6px;
    cursor: pointer;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  button.icon-btn:hover { background: var(--panel-2); color: var(--text); }
  button.icon-btn:active { transform: scale(0.92); }
  button.icon-btn svg { width: 20px; height: 20px; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 88%;
    margin: 6px 0;
    animation: rise 0.22s ease both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.assistant { align-self: flex-start; }
  .msg-row.error { align-self: flex-start; max-width: 95%; }

  .avatar {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: #04121f;
    background: var(--agent-accent);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.35);
  }

  .msg {
    padding: 10px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 15px;
    line-height: 1.45;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  }
  .msg-row.user .msg {
    background: linear-gradient(135deg, var(--user-bubble-a), var(--user-bubble-b));
    color: #fff;
    border-bottom-right-radius: 5px;
  }
  .msg-row.assistant .msg {
    background: var(--assistant-bubble);
    border: 1px solid rgba(255, 255, 255, 0.04);
    border-left: 3px solid var(--agent-accent);
    border-bottom-left-radius: 5px;
  }
  .msg-row.error .msg {
    background: rgba(251, 113, 133, 0.08);
    border: 1px solid var(--error);
    color: var(--error);
    border-radius: 12px;
    font-size: 13.5px;
  }
  .bubble-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .feedback-row {
    display: flex;
    gap: 4px;
    padding-left: 2px;
  }
  .fb-btn {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 3px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: background 0.15s ease, color 0.15s ease, opacity 0.15s ease;
  }
  .fb-btn svg { width: 14px; height: 14px; }
  .fb-btn:hover:not(:disabled) { background: var(--panel-2); color: var(--text); }
  .fb-btn.active { color: var(--agent-accent); }
  .fb-btn:disabled { cursor: default; }
  .fb-btn:disabled:not(.active) { opacity: 0.35; }

  .meta-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    padding-left: 2px;
  }
  .meta-badge {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--text-dim);
    background: var(--panel-2);
    border-radius: 10px;
    padding: 3px 8px 3px 6px;
    line-height: 1.3;
  }
  .meta-badge svg { width: 11px; height: 11px; flex-shrink: 0; }
  .meta-badge .meta-badge-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

  .msg.pending { color: var(--text-dim); }
  .pending-dots span {
    display: inline-block;
    width: 5px;
    height: 5px;
    margin-right: 3px;
    border-radius: 50%;
    background: var(--text-dim);
    animation: bounce 1.1s infinite ease-in-out;
  }
  .pending-dots span:nth-child(2) { animation-delay: 0.15s; }
  .pending-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .empty-state svg { width: 40px; height: 40px; opacity: 0.5; }

  form#composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  textarea#input {
    flex: 1;
    resize: none;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 11px 16px;
    font-size: 15px;
    font-family: inherit;
    max-height: 120px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea#input:focus {
    outline: none;
    border-color: var(--agent-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--agent-accent) 25%, transparent);
  }
  button#send {
    background: var(--agent-accent);
    color: #04121f;
    border: none;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  button#send svg { width: 19px; height: 19px; }
  button#send:hover:not(:disabled) { filter: brightness(1.1); }
  button#send:active:not(:disabled) { transform: scale(0.92); }
  button#send:disabled { opacity: 0.4; cursor: default; }

  dialog#settings, dialog#sage {
    background: #141c33;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    width: calc(100% - 32px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  }
  dialog#settings { max-width: 360px; }
  dialog#sage { max-width: 440px; max-height: calc(100% - 64px); overflow-y: auto; }
  dialog#settings::backdrop, dialog#sage::backdrop { background: rgba(4, 8, 20, 0.7); backdrop-filter: blur(2px); }
  dialog#settings h2, dialog#sage h2 { margin-top: 0; font-size: 17px; }
  dialog#settings label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  dialog#settings input[type="password"] {
    width: 100%;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    margin-bottom: 10px;
    transition: border-color 0.15s ease;
  }
  dialog#settings input[type="password"]:focus { outline: none; border-color: var(--accent); }
  dialog#settings .row, dialog#sage .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  dialog#settings button, dialog#sage button {
    border: none;
    border-radius: 10px;
    padding: 9px 15px;
    font-size: 14px;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.1s ease;
  }
  dialog#settings button:active, dialog#sage button:active { transform: scale(0.96); }
  dialog#settings button.save, dialog#sage button.save { background: var(--accent); color: #04263a; font-weight: 600; }
  dialog#settings button.save:hover, dialog#sage button.save:hover { filter: brightness(1.08); }
  dialog#settings button.danger, dialog#sage button.danger { background: transparent; color: var(--error); }
  dialog#settings button.danger:hover, dialog#sage button.danger:hover { background: rgba(251, 113, 133, 0.1); }
  dialog#settings button.cancel, dialog#sage button.cancel { background: var(--panel-2); color: var(--text); }
  dialog#settings button.cancel:hover, dialog#sage button.cancel:hover { filter: brightness(1.2); }

  #sage-analyze { width: 100%; margin-bottom: 4px; }
  .sage-section { margin-bottom: 14px; }
  .sage-status { font-size: 13px; min-height: 16px; margin: 6px 0 0; }
  .proposal-list { display: flex; flex-direction: column; gap: 10px; }
  .proposal-card {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
  }
  .proposal-card .rationale { font-size: 13px; color: var(--text-dim); margin-bottom: 8px; }
  .proposal-card .prompt-preview,
  .proposal-card .diff-view {
    font-size: 13px;
    white-space: pre-wrap;
    background: var(--bg-2);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 10px;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.5;
  }
  .diff-added { background: rgba(74, 222, 128, 0.25); border-radius: 3px; }
  .diff-removed { background: rgba(251, 113, 133, 0.25); color: var(--text-dim); text-decoration: line-through; border-radius: 3px; }
  .diff-note { font-size: 11px; color: var(--text-dim); margin: -4px 0 8px; }
  .proposal-card button.accept { background: var(--success); color: #04250f; font-weight: 600; }
  .proposal-card button.accept:hover { filter: brightness(1.08); }
  .proposal-card button.reject { background: transparent; color: var(--error); border: 1px solid var(--error); }
  .proposal-card button.reject:hover { background: rgba(251, 113, 133, 0.1); }
  .no-proposals { font-size: 13px; color: var(--text-dim); text-align: center; padding: 12px 0; }
</style>
</head>
<body>
  <header>
    <h1>AILicious</h1>
    <div class="agent-picker">
      <span class="agent-dot" id="agent-dot"></span>
      <select id="agent"></select>
    </div>
    <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
  </header>

  <main id="messages">
    <div class="empty-state" id="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
      </svg>
      <span>Pick an agent above and say hello.</span>
    </div>
  </main>

  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message..." autocomplete="off"></textarea>
    <button id="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </form>

  <dialog id="settings">
    <h2>Settings</h2>
    <label for="api-key">API key</label>
    <input
      type="password"
      id="api-key"
      placeholder="X-API-Key for this backend"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
      spellcheck="false"
    />
    <div id="key-status" style="font-size: 13px; margin: 0 0 16px; min-height: 16px;"></div>
    <div class="row">
      <button type="button" class="cancel" id="open-sage">Persona (SAGE)</button>
      <button type="button" class="danger" id="clear-history">Clear this agent's chat</button>
    </div>
    <div class="row" style="margin-top: 12px;">
      <button type="button" class="cancel" id="settings-cancel">Cancel</button>
      <button type="button" class="save" id="settings-save">Save &amp; test</button>
    </div>
  </dialog>

  <dialog id="sage">
    <h2>SAGE — <span id="sage-agent-name"></span> persona</h2>
    <div class="sage-section">
      <button type="button" class="save" id="sage-analyze">Analyze conversations</button>
      <div class="sage-status" id="sage-analyze-status"></div>
    </div>
    <div class="sage-section">
      <div id="sage-proposals" class="proposal-list"></div>
    </div>
    <div class="row">
      <button type="button" class="danger" id="sage-reset">Reset persona to default</button>
    </div>
    <div class="row" style="margin-top: 12px;">
      <button type="button" class="cancel" id="sage-close">Close</button>
    </div>
  </dialog>

  <script>
    const AGENTS = ["nexus", "forge", "oracle", "sentinel", "codex", "avery"];
    const AGENT_COLORS = {
      nexus: "#38bdf8",
      forge: "#fb923c",
      oracle: "#c084fc",
      sentinel: "#fb7185",
      codex: "#34d399",
      avery: "#fbbf24",
    };
    const API_BASE = window.location.origin;

    const messagesEl = document.getElementById("messages");
    const emptyStateEl = document.getElementById("empty-state");
    const agentSelect = document.getElementById("agent");
    const agentDot = document.getElementById("agent-dot");
    const composerForm = document.getElementById("composer");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const settingsBtn = document.getElementById("settings-btn");
    const settingsDialog = document.getElementById("settings");
    const apiKeyInput = document.getElementById("api-key");
    const settingsSave = document.getElementById("settings-save");
    const settingsCancel = document.getElementById("settings-cancel");
    const clearHistoryBtn = document.getElementById("clear-history");
    const keyStatusEl = document.getElementById("key-status");
    const openSageBtn = document.getElementById("open-sage");
    const sageDialog = document.getElementById("sage");
    const sageAgentNameEl = document.getElementById("sage-agent-name");
    const sageCloseBtn = document.getElementById("sage-close");
    const sageAnalyzeBtn = document.getElementById("sage-analyze");
    const sageAnalyzeStatusEl = document.getElementById("sage-analyze-status");
    const sageProposalsEl = document.getElementById("sage-proposals");
    const sageResetBtn = document.getElementById("sage-reset");

    function storageKey(agent, suffix) {
      return `ailicious_${suffix}_${agent}`;
    }

    function getApiKey() {
      return (localStorage.getItem("ailicious_api_key") || "").trim();
    }

    function setApiKey(key) {
      localStorage.setItem("ailicious_api_key", key.trim());
    }

    function getSessionId(agent) {
      return localStorage.getItem(storageKey(agent, "session")) || null;
    }

    function setSessionId(agent, sessionId) {
      localStorage.setItem(storageKey(agent, "session"), sessionId);
    }

    function getHistory(agent) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(agent, "history")) || "[]");
      } catch {
        return [];
      }
    }

    function setHistory(agent, history) {
      localStorage.setItem(storageKey(agent, "history"), JSON.stringify(history));
    }

    function currentAgent() {
      return agentSelect.value;
    }

    function applyAgentAccent(agent) {
      const color = AGENT_COLORS[agent] || AGENT_COLORS.nexus;
      document.documentElement.style.setProperty("--agent-accent", color);
    }

    const THUMB_UP_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg>';
    const THUMB_DOWN_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"></path></svg>';
    const SEARCH_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>';
    const DELEGATE_SVG =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 10 20 15 15 20"></polyline><path d="M4 4v7a4 4 0 0 0 4 4h12"></path></svg>';

    // Ground-truth badges: what the backend actually did this turn (real delegation, real
    // search), shown independent of whether the model's own prose happened to mention it --
    // NEXUS deciding not to call a tool it had, or wording a delegation ambiguously, shouldn't
    // be the only way this is visible.
    function createMetaBadges(delegatedTo, searchedWeb) {
      if (!delegatedTo?.length && !searchedWeb?.length) return null;

      const row = document.createElement("div");
      row.className = "meta-badges";

      for (const agent of delegatedTo || []) {
        const badge = document.createElement("span");
        badge.className = "meta-badge";
        badge.title = `Delegated to ${agent.toUpperCase()}`;
        badge.innerHTML = `${DELEGATE_SVG}<span class="meta-badge-label">${agent.toUpperCase()}</span>`;
        row.appendChild(badge);
      }
      for (const query of searchedWeb || []) {
        const badge = document.createElement("span");
        badge.className = "meta-badge";
        badge.title = `Searched the web: ${query}`;
        badge.innerHTML = `${SEARCH_SVG}<span class="meta-badge-label">${query}</span>`;
        row.appendChild(badge);
      }
      return row;
    }

    function updateHistoryFeedback(agent, messageId, rating) {
      const history = getHistory(agent);
      const turn = history.find((t) => t.message_id === messageId);
      if (turn) {
        turn.feedback = rating;
        setHistory(agent, history);
      }
    }

    function createFeedbackRow(messageId, initialRating) {
      const row = document.createElement("div");
      row.className = "feedback-row";
      let current = initialRating ?? null;

      function makeBtn(svg, label) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "fb-btn";
        btn.innerHTML = svg;
        btn.setAttribute("aria-label", label);
        return btn;
      }

      const up = makeBtn(THUMB_UP_SVG, "Good response");
      const down = makeBtn(THUMB_DOWN_SVG, "Bad response");

      function render() {
        up.classList.toggle("active", current === 1);
        down.classList.toggle("active", current === -1);
        up.disabled = current !== null;
        down.disabled = current !== null;
      }
      render();

      async function vote(rating) {
        if (current !== null) return;
        const previous = current;
        current = rating;
        render();
        try {
          const resp = await fetch(`${API_BASE}/feedback`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-API-Key": getApiKey() },
            body: JSON.stringify({ message_id: messageId, rating }),
          });
          if (!resp.ok) throw new Error("feedback request failed");
          updateHistoryFeedback(currentAgent(), messageId, rating);
        } catch {
          current = previous;
          render();
        }
      }

      up.addEventListener("click", () => vote(1));
      down.addEventListener("click", () => vote(-1));
      row.append(up, down);
      return row;
    }

    function renderMessage(role, content, meta = {}) {
      const row = document.createElement("div");
      row.className = `msg-row ${role}`;

      if (role === "assistant") {
        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = currentAgent().charAt(0).toUpperCase();
        row.appendChild(avatar);

        const col = document.createElement("div");
        col.className = "bubble-col";

        const bubble = document.createElement("div");
        bubble.className = "msg";
        bubble.textContent = content;
        col.appendChild(bubble);

        const badges = createMetaBadges(meta.delegatedTo, meta.searchedWeb);
        if (badges) col.appendChild(badges);

        if (meta.messageId) {
          col.appendChild(createFeedbackRow(meta.messageId, meta.feedback ?? null));
        }

        row.appendChild(col);
        messagesEl.appendChild(row);
        return bubble;
      }

      const bubble = document.createElement("div");
      bubble.className = "msg";
      bubble.textContent = content;
      row.appendChild(bubble);

      messagesEl.appendChild(row);
      return bubble;
    }

    function renderPending() {
      const bubble = renderMessage("assistant", "");
      bubble.classList.add("pending");
      bubble.innerHTML = '<span class="pending-dots"><span></span><span></span><span></span></span>';
      return bubble;
    }

    function renderHistory(agent) {
      messagesEl.innerHTML = "";
      const history = getHistory(agent);
      if (history.length === 0) {
        messagesEl.appendChild(emptyStateEl);
        return;
      }
      for (const turn of history) {
        renderMessage(turn.role, turn.content, {
          messageId: turn.message_id,
          feedback: turn.feedback,
          delegatedTo: turn.delegated_to,
          searchedWeb: turn.searched_web,
        });
      }
      scrollToBottom();
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function populateAgentSelect() {
      for (const agent of AGENTS) {
        const opt = document.createElement("option");
        opt.value = agent;
        opt.textContent = agent.toUpperCase();
        agentSelect.appendChild(opt);
      }
      agentSelect.value = localStorage.getItem("ailicious_last_agent") || "nexus";
      applyAgentAccent(agentSelect.value);
    }

    agentSelect.addEventListener("change", () => {
      localStorage.setItem("ailicious_last_agent", currentAgent());
      applyAgentAccent(currentAgent());
      renderHistory(currentAgent());
    });

    function setKeyStatus(text, color) {
      keyStatusEl.textContent = text;
      keyStatusEl.style.color = color;
    }

    settingsBtn.addEventListener("click", () => {
      apiKeyInput.value = getApiKey();
      setKeyStatus("", "");
      settingsDialog.showModal();
    });

    settingsCancel.addEventListener("click", () => settingsDialog.close());

    settingsSave.addEventListener("click", async () => {
      const key = apiKeyInput.value.trim();
      setApiKey(key);

      settingsSave.disabled = true;
      setKeyStatus("Testing key…", "var(--text-dim)");

      try {
        const resp = await fetch(`${API_BASE}/agents`, { headers: { "X-API-Key": key } });
        if (resp.ok) {
          setKeyStatus("✓ Key works — saved.", "var(--success)");
          setTimeout(() => settingsDialog.close(), 700);
        } else if (resp.status === 401) {
          setKeyStatus("✗ Server rejected this key (401). Check for typos or extra spaces.", "var(--error)");
        } else {
          setKeyStatus(`✗ Unexpected response (${resp.status}). Saved anyway.`, "var(--error)");
        }
      } catch (err) {
        setKeyStatus(`✗ Couldn't reach the server: ${err.message}`, "var(--error)");
      } finally {
        settingsSave.disabled = false;
      }
    });

    clearHistoryBtn.addEventListener("click", () => {
      const agent = currentAgent();
      setHistory(agent, []);
      localStorage.removeItem(storageKey(agent, "session"));
      renderHistory(agent);
      settingsDialog.close();
    });

    function setSageStatus(text, color) {
      sageAnalyzeStatusEl.textContent = text;
      sageAnalyzeStatusEl.style.color = color;
    }

    function renderNoProposals(text = "No pending proposals yet.") {
      sageProposalsEl.innerHTML = `<div class="no-proposals">${text}</div>`;
    }

    // Word-level diff (LCS-based) between the agent's current system prompt and a proposal's
    // proposed one -- so accepting is an informed "here's exactly what changes" decision
    // instead of re-reading the whole prompt from scratch and trying to spot the difference.
    function tokenizeForDiff(text) {
      return text.match(/\S+|\s+/g) || [];
    }

    function computeWordDiff(oldText, newText) {
      const a = tokenizeForDiff(oldText);
      const b = tokenizeForDiff(newText);
      const n = a.length;
      const m = b.length;
      const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
      const ops = [];
      let i = 0;
      let j = 0;
      while (i < n && j < m) {
        if (a[i] === b[j]) {
          ops.push({ type: "same", text: a[i] });
          i++;
          j++;
        } else if (dp[i + 1][j] >= dp[i][j + 1]) {
          ops.push({ type: "removed", text: a[i] });
          i++;
        } else {
          ops.push({ type: "added", text: b[j] });
          j++;
        }
      }
      while (i < n) {
        ops.push({ type: "removed", text: a[i] });
        i++;
      }
      while (j < m) {
        ops.push({ type: "added", text: b[j] });
        j++;
      }
      return ops;
    }

    function renderDiffView(oldText, newText) {
      const view = document.createElement("div");
      view.className = "diff-view";
      for (const op of computeWordDiff(oldText, newText)) {
        if (op.type === "same") {
          view.appendChild(document.createTextNode(op.text));
          continue;
        }
        const span = document.createElement("span");
        span.className = op.type === "added" ? "diff-added" : "diff-removed";
        span.textContent = op.text;
        view.appendChild(span);
      }
      return view;
    }

    function renderProposalCard(proposal, currentSystemPrompt) {
      const card = document.createElement("div");
      card.className = "proposal-card";

      const rationale = document.createElement("div");
      rationale.className = "rationale";
      rationale.textContent = proposal.rationale;
      card.appendChild(rationale);

      if (typeof currentSystemPrompt === "string") {
        const note = document.createElement("div");
        note.className = "diff-note";
        note.textContent = "Highlighted: removed (struck through) vs. added, against the current persona.";
        card.appendChild(note);
        card.appendChild(renderDiffView(currentSystemPrompt, proposal.proposed_system_prompt));
      } else {
        const preview = document.createElement("div");
        preview.className = "prompt-preview";
        preview.textContent = proposal.proposed_system_prompt;
        card.appendChild(preview);
      }

      const row = document.createElement("div");
      row.className = "row";

      const acceptBtn = document.createElement("button");
      acceptBtn.type = "button";
      acceptBtn.className = "accept";
      acceptBtn.textContent = "Accept";

      const rejectBtn = document.createElement("button");
      rejectBtn.type = "button";
      rejectBtn.className = "reject";
      rejectBtn.textContent = "Reject";

      async function decide(action) {
        acceptBtn.disabled = true;
        rejectBtn.disabled = true;
        try {
          const resp = await fetch(`${API_BASE}/sage/proposals/${proposal.id}/${action}`, {
            method: "POST",
            headers: { "X-API-Key": getApiKey() },
          });
          if (!resp.ok) throw new Error(`request failed (${resp.status})`);
          card.remove();
          if (!sageProposalsEl.children.length) renderNoProposals();
        } catch (err) {
          acceptBtn.disabled = false;
          rejectBtn.disabled = false;
          setSageStatus(`✗ Couldn't ${action} proposal: ${err.message}`, "var(--error)");
        }
      }

      acceptBtn.addEventListener("click", () => decide("accept"));
      rejectBtn.addEventListener("click", () => decide("reject"));

      row.append(acceptBtn, rejectBtn);
      card.appendChild(row);
      return card;
    }

    async function fetchCurrentSystemPrompt(agent) {
      const resp = await fetch(`${API_BASE}/sage/current/${agent}`, {
        headers: { "X-API-Key": getApiKey() },
      });
      if (!resp.ok) throw new Error(`request failed (${resp.status})`);
      const data = await resp.json();
      return data.system_prompt;
    }

    async function loadProposals() {
      const agent = currentAgent();
      sageProposalsEl.innerHTML = '<div class="no-proposals">Loading…</div>';
      try {
        const resp = await fetch(`${API_BASE}/sage/proposals?agent=${agent}&status=pending`, {
          headers: { "X-API-Key": getApiKey() },
        });
        if (!resp.ok) throw new Error(`request failed (${resp.status})`);
        const data = await resp.json();
        sageProposalsEl.innerHTML = "";
        if (!data.proposals.length) {
          renderNoProposals();
          return;
        }
        // Best-effort: a diff needs the current prompt, but a proposal is still reviewable
        // without one -- renderProposalCard falls back to a plain preview if this is undefined.
        let currentSystemPrompt;
        try {
          currentSystemPrompt = await fetchCurrentSystemPrompt(agent);
        } catch {
          currentSystemPrompt = undefined;
        }
        for (const proposal of data.proposals) {
          sageProposalsEl.appendChild(renderProposalCard(proposal, currentSystemPrompt));
        }
      } catch (err) {
        renderNoProposals(`Couldn't load proposals: ${err.message}`);
      }
    }

    openSageBtn.addEventListener("click", () => {
      if (!getApiKey()) {
        setKeyStatus("Save an API key first.", "var(--error)");
        return;
      }
      settingsDialog.close();
      sageAgentNameEl.textContent = currentAgent().toUpperCase();
      setSageStatus("", "");
      sageDialog.showModal();
      loadProposals();
    });

    sageCloseBtn.addEventListener("click", () => sageDialog.close());

    sageAnalyzeBtn.addEventListener("click", async () => {
      const agent = currentAgent();
      sageAnalyzeBtn.disabled = true;
      setSageStatus("Analyzing feedback…", "var(--text-dim)");
      try {
        const resp = await fetch(`${API_BASE}/sage/analyze/${agent}`, {
          method: "POST",
          headers: { "X-API-Key": getApiKey() },
        });
        const data = await resp.json();
        if (!resp.ok) {
          setSageStatus(`✗ ${data.detail || `Request failed (${resp.status})`}`, "var(--error)");
          return;
        }
        setSageStatus("✓ New proposal ready below.", "var(--success)");
        await loadProposals();
      } catch (err) {
        setSageStatus(`✗ Network error: ${err.message}`, "var(--error)");
      } finally {
        sageAnalyzeBtn.disabled = false;
      }
    });

    sageResetBtn.addEventListener("click", async () => {
      const agent = currentAgent();
      sageResetBtn.disabled = true;
      try {
        const resp = await fetch(`${API_BASE}/sage/reset/${agent}`, {
          method: "POST",
          headers: { "X-API-Key": getApiKey() },
        });
        if (!resp.ok) throw new Error(`request failed (${resp.status})`);
        setSageStatus("✓ Reset to default persona.", "var(--success)");
      } catch (err) {
        setSageStatus(`✗ Couldn't reset: ${err.message}`, "var(--error)");
      } finally {
        sageResetBtn.disabled = false;
      }
    });

    // auto-grow textarea up to CSS max-height
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = `${inputEl.scrollHeight}px`;
    });

    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        composerForm.requestSubmit();
      }
    });

    composerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        settingsBtn.click();
        return;
      }

      const agent = currentAgent();
      const history = getHistory(agent);

      history.push({ role: "user", content: message });
      setHistory(agent, history);
      if (emptyStateEl.parentElement) messagesEl.removeChild(emptyStateEl);
      renderMessage("user", message);
      inputEl.value = "";
      inputEl.style.height = "auto";
      scrollToBottom();

      sendBtn.disabled = true;
      const pending = renderPending();
      scrollToBottom();

      try {
        const resp = await fetch(`${API_BASE}/agents/${agent}`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-API-Key": apiKey,
          },
          body: JSON.stringify({ message, session_id: getSessionId(agent) }),
        });

        const data = await resp.json();

        if (!resp.ok) {
          pending.closest(".msg-row").remove();
          renderMessage("error", data.detail || `Request failed (${resp.status})`);
          scrollToBottom();
          return;
        }

        setSessionId(agent, data.session_id);
        pending.classList.remove("pending");
        pending.textContent = data.response;

        const badges = createMetaBadges(data.delegated_to, data.searched_web);
        if (badges) pending.parentElement.appendChild(badges);
        pending.parentElement.appendChild(createFeedbackRow(data.message_id, null));

        const updatedHistory = getHistory(agent);
        updatedHistory.push({
          role: "assistant",
          content: data.response,
          message_id: data.message_id,
          feedback: null,
          delegated_to: data.delegated_to || [],
          searched_web: data.searched_web || [],
        });
        setHistory(agent, updatedHistory);
      } catch (err) {
        pending.closest(".msg-row").remove();
        renderMessage("error", `Network error: ${err.message}`);
      } finally {
        sendBtn.disabled = false;
        scrollToBottom();
      }
    });

    populateAgentSelect();
    renderHistory(currentAgent());

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
